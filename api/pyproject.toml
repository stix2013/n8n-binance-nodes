[project]
name = "api"
version = "1.7.0"
description = "API for n8n - News Sentiment Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.127.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # News sentiment dependencies
    "asyncpg>=0.29.0",
    "feedparser>=6.0.12",
    "vaderSentiment>=3.3.2",
    "spacy>=3.7.0",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.2.0",
    # Celery for background tasks
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    # Machine Learning
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
    # CPU-only PyTorch (smaller image size, faster build)
    "torch>=2.0.0; platform_system != 'Darwin'",
    "torchvision>=0.15.0; platform_system != 'Darwin'",
]

[tool.pip]
# Use CPU-only PyTorch index to avoid NVIDIA dependencies
extra-index-url = "https://download.pytorch.org/whl/cpu"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.27.0",
    "pytest-cov>=4.0.0",
]
