services:
  # n8n Main
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.9.4-amd64}
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "binance.com:3.170.91.76"
      - "www.binance.com:3.170.91.76"
      - "api.binance.com:108.156.104.23"
      - "developers.binance.com:18.172.242.31"
      - "fapi.binance.com:13.35.24.46"
      - "host.docker.internal:192.168.0.14"
      - "host.local:192.168.0.14"
      - "fstream.binance.com:13.249.134.34"
      - "stream.binance.com:13.114.105.102"
    networks:
      - n8n_network
    ports:
      - "${N8N_HOST_PORT}:${N8N_PORT}"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=user
      - N8N_BASIC_AUTH_PASSWORD=password123
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=http
      # - N8N Runners
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_EXECUTIONS_PROCESS=child
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # - N8N_RUNNERS_HOST=${N8N_RUNNERS_HOST}
      # - N8N_RUNNERS_PORT=${N8N_RUNNERS_PORT}
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      # 
      - TZ=Asia/Jakarta
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_RESTRICT_FILE_ACCESS_TO=${N8N_RESTRICT_FILE_ACCESS_TO}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS}
      - NODE_FUNCTION_ALLOW_EXTERNAL=moment,uuid,@binance/spot,@binance/common,trading-signals
      # - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_MIGRATE_FS_STORAGE_PATH=true
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      # Database
      - DB_TYPE=${N8N_DB_TYPE:-postgresdb}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./docs/analyse:/home/node/analyse:rw
      - ./nodes/@stix:/home/node/.n8n/custom:rw
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          '(wget -q -T 5 -O - http://localhost:5678/healthz 2>/dev/null | grep -qF ''{"status":"ok"}'') || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3600s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # n8n Tasks Runners
  task-runners:
    # image: n8nio/runners:2.9.4
    image: n8nio-runners-local:${N8N_VERSION:-2.9.4}
    build:
      context: .
      dockerfile: dockers/Dockerfile.runners
      args:
        - N8N_VERSION=${N8N_VERSION:-2.9.4}
    restart: always
    networks:
      - n8n_network
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_EXECUTIONS_PROCESS=child
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./docs/analyse:/home/node/analyse:rw
    dns:
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "binance.com:3.170.91.76"
      - "www.binance.com:3.170.91.76"
      - "api.binance.com:108.156.104.23"
      - "developers.binance.com:18.172.242.31"
      - "fapi.binance.com:13.35.24.46"
      - "fstream.binance.com:13.249.134.34"
      - "stream.binance.com:13.114.105.102"
    # environment:
    #   - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
    #   - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    #   - N8N_RUNNERS_EXECUTIONS_PROCESS=child
      # - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker:5679
      # - N8N_RESTRICT_FILE_ACCESS_TO=${N8N_RESTRICT_FILE_ACCESS_TO}
      # - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=${N8N_RUNNERS_LAUNCHER_LOG_LEVEL}
      # - N8N_RUNNERS_EXTERNAL_ALLOW=${N8N_RUNNERS_EXTERNAL_ALLOW}
      # - N8N_RUNNERS_PORT=${N8N_RUNNERS_PORT}
      # - NODE_FUNCTION_ALLOW_EXTERNAL=${NODE_FUNCTION_ALLOW_EXTERNAL}
      # - N8N_RUNNERS_TASK_RUNNER_CONFIG_PATH=/config/n8n-task-runners.json
      # - NODE_OPTIONS="--max-old-space-size=1024"
      # - N8N_RUNNERS_MAX_CONCURRENCY=5
      # - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=120
    # volumes:
      # - ./config/n8n-task-runners.json:/config/n8n-task-runners.json
      # - ./docs/analyse:/home/node/analyse:rw
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://task-runners:5680/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - 5433:5432
    networks:
      - n8n_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_NON_ROOT_USER=${POSTGRES_NON_ROOT_USER:-n8n}
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis (Celery Broker & Result Backend)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - n8n_network
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # API Python
  api:
    image: api-python${API_PYTHON_VERSION:-3.14}:${API_VERSION:-1.6.0}
    build:
      context: .
      dockerfile: dockers/Dockerfile.python
      args:
        - API_VERSION=${API_VERSION:-1.6.0}
    restart: unless-stopped
    networks:
      - n8n_network
    ports:
      - "8001:8000"
    extra_hosts:
      - "binance.com:3.170.91.76"
      - "www.binance.com:3.170.91.76"
      - "api.binance.com:108.156.104.23"
      - "developers.binance.com:18.172.242.31"
      - "fapi.binance.com:13.35.24.46"
      - "fstream.binance.com:13.249.134.34"
      - "stream.binance.com:13.114.105.102"
    environment:
      - PYTHONUNBUFFERED=1
      - API_LOG_LEVEL=${API_LOG_LEVEL:-INFO}
      - PYTHONPATH=/app:/libs/crypto-analysis/src
    volumes:
      - ./api:/app
      - ../../../../trader/crypto-analysis:/libs/crypto-analysis
      - ./models:/app/models
      - ./.env:/app/.env:ro

  # Celery Worker (Model Training)
  celery-worker:
    image: api-python${API_PYTHON_VERSION:-3.14}:${API_VERSION:-1.6.0}
    build:
      context: .
      dockerfile: dockers/Dockerfile.python
      args:
        - API_VERSION=${API_VERSION:-1.6.0}
    restart: unless-stopped
    networks:
      - n8n_network
    command: python -m celery -A src.config.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info}
    extra_hosts:
      - "binance.com:3.170.91.76"
      - "www.binance.com:3.170.91.76"
      - "api.binance.com:108.156.104.23"
      - "developers.binance.com:18.172.242.31"
      - "fapi.binance.com:13.35.24.46"
      - "fstream.binance.com:13.249.134.34"
      - "stream.binance.com:13.114.105.102"
    volumes:
      - ./api:/app
      - ../../../../trader/crypto-analysis:/libs/crypto-analysis
      - ./models:/app/models
      - ./.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app:/libs/crypto-analysis/src
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# Volumes
volumes:
  n8n_data:
    name: n8n_data
  n8n_storage:
    external: true
    name: n8n_storage
  n8n_mcp:
    name: n8n_mcp
  postgres_data:
    name: postgres_data
  rabbitmq_data:
    external: true
    name: rabbitmq_data
  redis_data:
    name: redis_data
  models_storage:
    name: models_storage
# Networks 
networks:
  n8n_network:
    external: true
    name: n8n_network
